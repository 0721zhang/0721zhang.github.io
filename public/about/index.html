<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>解密小银杏</title>
<style>
/* 这段 :root 是独立运行的本地副本，接进站点时可以整段删除，届时会自动继承站点的同名变量。 */
:root {
  --hue: 165;
  --page-bg: oklch(0.95 0.01 var(--hue));
  --card-bg: #ffffff;
  --deep-text: oklch(0.25 0.02 var(--hue));
  --primary: oklch(0.70 0.14 var(--hue));
  --btn-regular-bg: oklch(0.95 0.025 var(--hue));
  --btn-content: oklch(0.55 0.12 var(--hue));
  --line-divider: rgba(0, 0, 0, 0.08);

  /* 点缀色：只在解密成功、档案编号、银杏叶装饰等少数位置使用。 */
  --ginkgo: #D9A956;
  --gold-brown: #7A5C2E;
  --mint: #A9BE9D;
  --paper: #F4F0E6;
}
:root.dark {
  --page-bg: oklch(0.16 0.014 var(--hue));
  --card-bg: oklch(0.23 0.015 var(--hue));
  --deep-text: oklch(0.94 0.01 var(--hue));
  --primary: oklch(0.75 0.14 var(--hue));
  --btn-regular-bg: oklch(0.33 0.035 var(--hue));
  --btn-content: oklch(0.75 0.1 var(--hue));
  --line-divider: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; }
html { color-scheme: light; }
html.dark { color-scheme: dark; }
body {
  margin: 0;
  background: var(--page-bg);
  color: var(--deep-text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
button, input { font: inherit; }
button, summary { -webkit-tap-highlight-color: transparent; }
button {
  min-height: 46px;
  padding: 9px 17px;
  border: 1px solid var(--line-divider);
  border-radius: 9px;
  background: var(--btn-regular-bg);
  color: var(--btn-content);
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--primary); }
button:disabled { opacity: .55; cursor: default; }
button.primary {
  color: var(--deep-text);
  border-color: var(--primary);
  font-weight: 650;
}
button.quiet { background: transparent; color: var(--deep-text); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
h1, h2, h3 { line-height: 1.4; letter-spacing: .025em; }
h1 { margin: 14px 0 8px; font-size: clamp(2rem, 7vw, 3.25rem); }
h2 { font-size: clamp(1.45rem, 5vw, 2rem); margin: 8px 0 16px; }
h3 { font-size: 1.05rem; margin: 22px 0 8px; }
p { margin: 12px 0; }
a { color: var(--btn-content); text-underline-offset: 3px; }
a:hover { color: var(--primary); }
header {
  max-width: 920px;
  margin: auto;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand strong { font-size: .95rem; }
.leaf { width: 40px; height: 40px; flex: 0 0 auto; color: var(--ginkgo); }
nav { display: flex; flex-wrap: wrap; gap: 8px; }
nav button { padding: 7px 12px; font-size: .88rem; }
main { width: min(100% - 32px, 820px); margin: 10px auto 48px; }
.card {
  background: var(--card-bg);
  border: 1px solid var(--line-divider);
  border-radius: 16px;
  padding: clamp(20px, 5vw, 44px);
  min-width: 0;
}
.eyebrow { font-size: .8rem; letter-spacing: .13em; margin: 0 0 10px; }
.archive-number { color: var(--ginkgo); font-family: ui-monospace, monospace; }
.subtitle { font-size: 1.08rem; }
.intro { margin: 30px 0; border-left: 2px solid var(--primary); padding-left: 20px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.small { font-size: .88rem; }
.divider { border: 0; border-top: 1px solid var(--line-divider); margin: 28px 0; }
.steps { display: flex; gap: 7px; margin: 0 0 20px; padding: 0; list-style: none; }
.steps li {
  flex: 1;
  border-bottom: 3px solid var(--line-divider);
  text-align: center;
  font-size: .8rem;
  padding-bottom: 7px;
}
.steps li.solved { border-color: var(--ginkgo); }
.steps li.skipped { border-bottom-style: dashed; border-color: var(--btn-content); }
.steps li.current { background: var(--btn-regular-bg); border-radius: 5px 5px 0 0; }
.steps li.revisitable { cursor: pointer; }
.steps li.revisitable:hover { background: var(--btn-regular-bg); border-radius: 5px 5px 0 0; }
.algorithm {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  background: var(--btn-regular-bg);
  color: var(--btn-content);
  font-size: .85rem;
}
.puzzle {
  background: var(--btn-regular-bg);
  color: var(--btn-content);
  border: 1px solid var(--line-divider);
  border-radius: 10px;
  padding: 18px;
  margin: 20px 0;
  min-width: 0;
}
.puzzle-label { margin: 0 0 7px; font-size: .85rem; }
.cipher {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: 650 1.25rem/1.9 ui-monospace, SFMono-Regular, Consolas, monospace;
  letter-spacing: .09em;
}
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
.rule { font-size: .93rem; }
.ab-group { display: inline-block; white-space: nowrap; margin-right: .65em; }
.ab-a { font-weight: 400; }
.ab-b { font-weight: 800; text-decoration: underline; text-underline-offset: 4px; }
fieldset { margin: 22px 0 0; padding: 0; border: 0; min-width: 0; }
legend, .input-label { font-weight: 650; margin-bottom: 10px; display: block; }
input[type="text"] {
  width: 100%;
  min-width: 0;
  min-height: 50px;
  padding: 11px 14px;
  background: var(--card-bg);
  color: var(--deep-text);
  border: 1px solid var(--btn-content);
  border-radius: 9px;
}
.options { display: grid; gap: 10px; }
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px solid var(--line-divider);
  border-radius: 9px;
  cursor: pointer;
}
.option:has(input:checked) { border-color: var(--primary); background: var(--btn-regular-bg); }
input[type="radio"] { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--btn-content); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 20px 0; font-size: .93rem; }
th, td { text-align: center; border: 1px solid var(--line-divider); padding: 12px 8px; }
th { font-weight: 600; background: var(--btn-regular-bg); }
th:first-child { width: 46%; text-align: left; }
.records { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
.record { border: 1px solid var(--line-divider); border-radius: 10px; padding: 16px; }
.record h3 { margin-top: 0; }
.feedback { min-height: 1.8em; margin: 12px 0 0; font-size: .93rem; }
.hints:empty { display: none; }
.hints { border-top: 1px solid var(--line-divider); margin-top: 22px; padding-top: 5px; }
.hint { white-space: pre-wrap; font-size: .93rem; }
.hint h3 { font-size: .92rem; }
.story { border-top: 2px solid var(--ginkgo); margin-top: 26px; padding-top: 20px; }
.success { font-weight: 650; }
.success::before { content: "✓"; color: var(--ginkgo); margin-right: 8px; }
.story-block p { white-space: pre-line; }
.explanation { background: var(--btn-regular-bg); padding: 16px; border-radius: 9px; margin-top: 20px; }
.explanation h3 { margin-top: 0; }
details { border-top: 1px solid var(--line-divider); padding: 14px 0; }
summary { cursor: pointer; min-height: 44px; padding: 8px 0; font-weight: 600; }
details p { margin-left: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.stat { background: var(--btn-regular-bg); border-radius: 9px; padding: 14px 8px; text-align: center; }
.stat strong { display: block; font-size: 1.8rem; line-height: 1.4; }
.stat span { font-size: .85rem; }
.note { border-left: 2px solid var(--primary); padding-left: 14px; font-size: .92rem; }
.hidden-entry {
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid var(--line-divider);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.hidden-entry-info { flex: 1 1 auto; min-width: 0; }
.hidden-entry button { font-size: .88rem; }
.storage {
  width: min(100% - 32px, 820px);
  margin: 0 auto 16px;
  padding: 12px 16px;
  border: 1px solid var(--primary);
  border-radius: 9px;
  background: var(--card-bg);
  font-size: .85rem;
}
[hidden] { display: none !important; }
footer { text-align: center; font-size: .8rem; padding: 0 16px 26px; }
/* 档案页右下角的出口：回到博客首页。与隐藏关入口并排，靠右对齐 */
.exit-link {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 17px;
  border: 2px solid var(--ginkgo);
  border-radius: 10px;
  background: #ffffff;
  color: #3D4A42;
  font-size: .9rem;
  font-weight: 650;
  text-decoration: none;
  transition: background-color .18s ease, color .18s ease;
}
.exit-link:hover { background: var(--ginkgo); color: #ffffff; }
/* 放在按钮行右端时使用 */
.exit-link-end { margin-left: auto; }
@media (max-width: 540px) {
  .hidden-entry { align-items: stretch; }
  .exit-link { width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  .exit-link { transition: none; }
}
.morse-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 6px 12px;
  font-family: ui-monospace, monospace;
  font-size: .9rem;
}
@media (max-width: 540px) {
  header { padding: 16px; align-items: flex-start; }
  header nav { justify-content: flex-end; }
  .brand strong { display: none; }
  .records { grid-template-columns: 1fr; }
  .actions > button { flex: 1 1 120px; }
  .cipher { font-size: 1.08rem; letter-spacing: .04em; }
  th, td { padding: 10px 5px; font-size: .84rem; }
  .intro { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>
</head>

function freshState() {
  return {
    version: 1,
    theme: null,
    page: "home",
    current: 0,

    progress: LEVELS.map(() => ({status: "pending", hints: 0}))

function showStorageNotice(text) {

  storageNotice.hidden = false;

/* 严格检查存档结构；损坏的存档不会进入页面渲染逻辑。 */
function validateState(value) {
  if (!value || value.version !== 1 ||
      ![null, "light", "dark"].includes(value.theme) ||
      !["home", "level", "archive"].includes(value.page) ||
      !Number.isInteger(value.current) ||
      value.current < 0 || value.current >= LEVELS.length ||
      !Number.isInteger(value.mainCursor) ||
      value.mainCursor < 0 || value.mainCursor >= MAIN_COUNT ||
      !Array.isArray(value.progress) || value.progress.length !== LEVELS.length) {
    return false;
  }
  if (!value.progress.every((p, i) =>
    p && ["pending", "solved", "skipped"].includes(p.status) &&
    Number.isInteger(p.hints) && p.hints >= 0 &&
    p.hints <= LEVELS[i].hints.length)) return false;

  // 主线只能顺序前进：遇到未完成关卡后，不应存在已完成的后续关卡。
  let pendingSeen = false;
  for (let i = 0; i < MAIN_COUNT; i++) {
    if (value.progress[i].status === "pending") pendingSeen = true;
    else if (pendingSeen) return false;
  }
  if (value.page === "level" && value.current < MAIN_COUNT) {
    if (value.progress.slice(0, value.current).some(p => p.status === "pending")) return false;
  }
  return true;
}
function loadState() {
  let raw;
  try {
    raw = window.localStorage.getItem(STORAGE_KEY);
  } catch (error) {
    storageAvailable = false;
    showStorageNotice("浏览器无法读取本地存储。进度和主题仅在本次页面打开期间保留，关闭后可能丢失。");
    return freshState();
  }
  if (raw === null) return freshState();
  try {
    const parsed = JSON.parse(raw);
    if (!validateState(parsed)) throw new Error("Invalid save");
    // 只复制受支持字段，避免存档中的额外属性影响运行。
    return {
      version: 1,
      theme: parsed.theme,
      page: parsed.page,
      current: parsed.current,
      mainCursor: parsed.mainCursor,
      progress: parsed.progress.map(p => ({status: p.status, hints: p.hints}))
    };
  } catch (error) {
    showStorageNotice("保存的数据损坏，无法恢复；本次已从入口重新开始。后续进度将尝试重新保存。");
    return freshState();
  }
}
let state = loadState();

function saveState() {
  if (!storageAvailable) return;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    storageAvailable = false;
    showStorageNotice("浏览器无法保存本地数据。当前游戏仍可继续，但本次进度和主题更改仅临时保留，关闭页面后可能丢失。");
  }
}

  const onSystemThemeChange = () => { if (state.theme === null) applyTheme(); };
  if (systemTheme.addEventListener) systemTheme.addEventListener("change", onSystemThemeChange);

/* 所有动态正文通过 textContent 写入，不把配置或用户输入当作 HTML 执行。 */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function button(text, onClick, className) {
  const node = el("button", className, text);
  node.type = "button";
  if (onClick) node.addEventListener("click", onClick);
  return node;
}
function heading(tag, text) {
  const node = el(tag, "", text);
  node.tabIndex = -1;
  node.dataset.pageHeading = "true";
  return node;
}
function mainStats() {
  return state.progress.slice(0, MAIN_COUNT).reduce((sum, p) => {
    if (p.status === "solved") sum.solved++;
    if (p.status === "skipped") sum.skipped++;
    sum.hints += p.hints;
    return sum;
  }, {solved: 0, skipped: 0, hints: 0});
}
function mainFinished() {
  return state.progress.slice(0, MAIN_COUNT).every(p => p.status !== "pending");
}
function go(page, index) {
  state.page = page;
  if (page === "level" && Number.isInteger(index)) {
    state.current = index;
    if (!LEVELS[index].hidden) state.mainCursor = index;
  }
  saveState();
  render(true);
}
function startMain() {
  if (mainFinished()) {
    go("archive");
    return;
  }
  const firstPending = state.progress.slice(0, MAIN_COUNT).findIndex(p => p.status === "pending");
  const cursor = state.mainCursor;
  // 已解出的当前关保留故事阅读位置；跳过的关卡不会阻挡流程。
  const canResume = cursor <= firstPending &&
    state.progress[cursor].status !== "skipped" &&
    state.progress.slice(0, cursor).every(p => p.status !== "pending");
  go("level", canResume ? cursor : firstPending);
}
function advance(index) {
  if (LEVELS[index].hidden || index === MAIN_COUNT - 1) go("archive");
  else go("level", index + 1);
}
/* 回看已经解出或跳过的关卡：只改变阅读位置，不动主线推进游标 mainCursor。
   否则从前面某关回看后关掉页面，下次打开会被带到回看的位置，而不是主线所在的位置。 */
function goBack(index) {
  state.page = "level";
  state.current = index;
  saveState();

}
/* 清空进度并回到初始状态。主题属于显示偏好，不随进度一起清除。 */
function clearProgress() {
  if (!window.confirm("确定清除全部解密进度，回到初始状态吗？此操作不可撤销。")) return;
  const keptTheme = state.theme;
  if (storageAvailable) {
    try {
      window.localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      storageAvailable = false;
    }
  }
  state = freshState();
  state.theme = keptTheme;
  go("home");
}

function renderSteps(index) {
  const list = el("ol", "steps");
  list.setAttribute("aria-label", "七道主线关卡进度");
  LEVELS.slice(0, MAIN_COUNT).forEach((level, i) => {
    const p = state.progress[i];
    const statusText = {pending: "未解出", solved: "已解出", skipped: "已跳过"}[p.status];
    // 已经解出或跳过的关卡可以点回去回看；还没做到的关卡不允许跳过去。
    const revisitable = p.status !== "pending" && i !== index;
    const item = el("li",
      p.status + (i === index ? " current" : "") + (revisitable ? " revisitable" : ""),
      String(i + 1));
    item.title = `${level.title}：${statusText}${revisitable ? "（点击回看）" : ""}`;
    item.setAttribute("aria-label",
      `第 ${i + 1} 关，${level.title}，${statusText}${revisitable ? "，点击回看" : ""}`);
    if (i === index) item.setAttribute("aria-current", "step");
    if (revisitable) {
      item.setAttribute("role", "button");
      item.tabIndex = 0;
      item.addEventListener("click", () => goBack(i));
      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          goBack(i);

    list.append(item);

  form.noValidate = true;
  const feedback = el("p", "feedback");
  feedback.id = "answerFeedback";
  feedback.setAttribute("role", "status");
  feedback.setAttribute("aria-live", "polite");
  let input = null;
  if (level.type === "choice") {
    const fieldset = el("fieldset");
    fieldset.disabled = solved;
    fieldset.append(el("legend", "", "请选择一项"));
    const options = el("div", "options");
    level.options.forEach(option => {
      const label = el("label", "option");
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer";
      radio.value = option.value;
      radio.setAttribute("aria-describedby", "answerFeedback");
      if (solved && option.value === level.answer) radio.checked = true;
      label.append(radio, el("span", "", option.label));
      options.append(label);
    });
    fieldset.append(options);
    form.append(fieldset);
  } else {
    const label = el("label", "input-label",
      level.type === "number" ? "请输入还原后的明文数字" : "请输入还原后的英文单词");
    label.htmlFor = "answerInput";
    input = document.createElement("input");
    input.id = "answerInput";
    input.name = "answer";
    input.type = "text";
    input.inputMode = level.type === "number" ? "numeric" : "text";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.setAttribute("autocapitalize", "none");
    input.setAttribute("aria-describedby", "answerFeedback");
    input.disabled = solved;
    if (solved) input.value = level.answer;
    form.append(label, input);
  }

  const actions = el("div", "actions");
  const submit = button("提交答案", null, "primary");
  submit.type = "submit";
  submit.disabled = solved;
  const hintButton = button("提示");
  const skip = button("跳过本关", () => {
    if (state.progress[index].status === "solved") return;
    state.progress[index].status = "skipped";
    advance(index);
  }, "quiet");
  skip.disabled = solved;
  actions.append(submit, hintButton, skip);
  form.append(actions, feedback);

  const hints = el("div", "hints");
  hints.id = "levelHints";
  hints.setAttribute("aria-live", "polite");
  hintButton.setAttribute("aria-controls", "levelHints");
  hintButton.addEventListener("click", () => {
    const p = state.progress[index];
    if (p.status === "solved" || p.hints >= level.hints.length) return;
    // 提示次数由已展开层数派生，不另设容易重复递增的计数器。
    p.hints++;
    saveState();
    renderHints(hints, index, hintButton);
    if (level.hidden) {
      const hiddenInfo = card.querySelector(".small");
      if (hiddenInfo) {
        const statusText = p.status === "skipped" ? "已跳过，可重新尝试" : "未解出";
        hiddenInfo.textContent = `隐藏关：${statusText} · 求助 ${p.hints} 次。此关不影响主线档案与探索记录。`;
      }
    }
  });
  renderHints(hints, index, hintButton);
  form.addEventListener("submit", event => {
    event.preventDefault();
    if (state.progress[index].status === "solved") return;
    let value;
    if (level.type === "choice") {
      const selected = form.querySelector('input[name="answer"]:checked');
      if (!selected) {
        feedback.textContent = "请先选择一项。";
        return;
      }
      value = selected.value;
    } else {
      value = input.value.trim();
      if (!value) {
        feedback.textContent = "请先输入答案。";
        input.focus();
        return;
      }
      // 仅忽略首尾空格和英文字母大小写，不删除中间字符。
      if (level.type === "text") value = value.toUpperCase();
    }
    if (value !== level.answer) {
      feedback.textContent = "还没有对上，再试试看。";
      return;
    }
    state.progress[index].status = "solved";
    saveState();
    render(false);
    const story = document.getElementById("solvedStory");
    if (story) {
      story.focus({preventScroll: true});
      story.scrollIntoView({block: "start"});
    }
  });
  card.append(form, hints);
  if (solved) {
    card.append(renderStory(level));
    const next = el("div", "actions");
    const label = level.hidden ? "返回完整档案"
      : index === MAIN_COUNT - 1 ? "下一关 · 查看完整档案" : "下一关";
    next.append(button(label, () => advance(index), "primary"));
    card.append(next);
  }
  app.append(card);
}
function renderArchive() {
  const card = el("section", "card");
  card.append(
    el("p", "eyebrow archive-number", "个人档案 · 总览"),
    heading("h2", "小银杏的完整档案"),
    el("p", "", "小银杏、下雨树根不着急（Rainsoaked Root, Unhurried）。")
  );
  PROFILE.forEach(item => {
    const detail = el("details");
    detail.append(el("summary", "", `${item.title}｜${item.summary}`));
    item.details.forEach(entry => {
      // 条目可以是纯文本，也可以是 {before, label, url} 形式的外链。
      if (typeof entry === "string") {
        detail.append(el("p", "", entry));
        return;
      }
      const p = el("p");
      p.append(document.createTextNode(entry.before));
      const link = el("a", "", entry.label);
      link.href = entry.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      p.append(link);
      detail.append(p);
    });
    card.append(detail);
  });
  card.append(el("hr", "divider"), el("h3", "", "探索记录"));
  const counts = mainStats();
  const grid = el("div", "stats");
  [
    ["已解出关卡数", `${counts.solved} / ${MAIN_COUNT}`],
    ["已跳过关卡数", String(counts.skipped)],
    ["求助次数", String(counts.hints)]
  ].forEach(([label, value]) => {
    const stat = el("div", "stat");
    stat.append(el("strong", "", value), el("span", "", label));
    grid.append(stat);
  });
  card.append(grid);
  card.append(el("p", "small", mainFinished()
    ? "七道主线关卡均已解出或跳过。以上记录只统计主线，不包含隐藏关。"
    : "直接阅读档案不会改变解出、跳过或提示记录。以上记录只统计七道主线关卡。"));
  card.append(el("p", "note", "这不是考试，不进行密码学水平排名，不根据提示次数扣分；记录的是一次探索过程，而不是考试成绩。"));

  const actions = el("div", "actions");
  actions.append(button("返回入口", () => go("home"), "quiet"));
  if (!mainFinished()) actions.append(button("返回主线解密", startMain, "primary"));
  actions.append(button("清除进度，重新开始", clearProgress, "quiet"));
  card.append(actions);

  const hiddenEntry = el("div", "hidden-entry");
  const hiddenInfo = el("div", "hidden-entry-info");
  hiddenInfo.append(button("数字锁 · 隐藏关卡", () => go("level", HIDDEN_INDEX), "quiet"));
  const hiddenProgress = state.progress[HIDDEN_INDEX];
  const hiddenStatus = {pending: "未解出", solved: "已解出", skipped: "已跳过"}[hiddenProgress.status];
  hiddenInfo.append(el("p", "small", `独立记录：${hiddenStatus} · 求助 ${hiddenProgress.hints} 次。可跳过，不影响主线。`));
  // 出口：回到博客首页，放在卡片内容的右下角
  const exitLink = el("a", "exit-link", "← 回到博客");
  exitLink.href = "/";
  hiddenEntry.append(hiddenInfo, exitLink);
  card.append(hiddenEntry);
  app.append(card);
}
function render(moveFocus) {
  app.replaceChildren();
  if (state.page === "level") renderLevel(state.current);
  else if (state.page === "archive") renderArchive();
  else renderHome();
  document.getElementById("homeButton").disabled = state.page === "home";
  document.getElementById("archiveButton").disabled = state.page === "archive";
  document.title = state.page === "level"
    ? `${LEVELS[state.current].title} · 解密小银杏`
    : state.page === "archive" ? "完整档案 · 解密小银杏" : "解密小银杏";
  if (moveFocus) {
    const title = app.querySelector("[data-page-heading]");
    if (title) title.focus({preventScroll: true});
    window.scrollTo(0, 0);
  }
}

// 初次写入也能发现“可读但不可写”的存储环境，不声称虚假的持久化成功。
saveState();
render(false);
</script>
</body>
